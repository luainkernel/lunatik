name: Checks
on:
  pull_request:
jobs:
  checks:
    name: Convention checks
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        # the shared checks run from the harness's submodule, and recursion.sh compiles the Lua of the lua/ one
        submodules: true
    - name: Install dependencies
      run: |
        bash harness/tools/retry.sh 5 90 sudo apt-get install -yq cppcheck gawk
        # luals.sh reads the Lua files a pull request touches with lua-language-server, which no package carries
        bash harness/tools/retry.sh 5 90 curl -fsSL https://github.com/LuaLS/lua-language-server/releases/download/3.19.1/lua-language-server-3.19.1-linux-x64.tar.gz -o /tmp/luals.tar.gz
        sudo mkdir -p /opt/lua-language-server && sudo tar -xzf /tmp/luals.tar.gz -C /opt/lua-language-server
        sudo ln -s /opt/lua-language-server/bin/lua-language-server /usr/local/bin/lua-language-server
    - name: Stage the pull request's diff
      # pre-commit reads the index, so the diff against the base is staged as a commit would be
      run: git reset -q --soft "origin/${{ github.base_ref }}"
    - name: Machine paths and credentials
      # a leak fails the run under its own name; pre-commit runs the same gate again below
      run: CHECK_STAGED=1 bash harness/tools/checks/machine-leak.sh $(git diff --cached --name-only --diff-filter=ACM)
    - name: Trailing blank line
      run: bash tools/checks/pre-commit
    - name: Fixups pending
      # a fixup! waits for the squash, and each round of a review pushes one, so the run warns of it and stays green
      run: |
        bash harness/tools/checks/fixups.sh "origin/${{ github.base_ref }}..${{ github.event.pull_request.head.sha }}" ||
          echo "::warning title=Fixups pending::fold the fixup!, amend! and squash! commits before the merge"
    - name: Binding and compiler apart
      # a C binding of lib/ and the compiler under bin/luaebpf are two pull requests, the compiler's stacked on the binding's
      run: bash tools/checks/bundled.sh "origin/${{ github.base_ref }}..${{ github.event.pull_request.head.sha }}"
    - name: C API entries
      # a name a header of lib/ declares with no entry in doc/capi.md fails the run
      run: bash tools/checks/capi-entries.sh lib/*.h
    - name: Layout
      # a top-level directory the Layout table does not list, or kernel-tree installs from outside it, fail the run
      run: bash tools/checks/layout.sh
    - name: Guard cases
      # each command guard read again against the cases it was proved on, its own change or one beneath it
      run: bash harness/tools/checks/cases.sh
    - name: Advisory checks
      # heuristics that nudge a review; they annotate the run and do not fail it
      run: bash harness/tools/checks/advisory.sh --github "origin/${{ github.base_ref }}" "${{ github.event.pull_request.head.sha }}"
