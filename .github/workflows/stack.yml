name: Stack
on:
  pull_request:
    # edited carries a change of base, the moment a stacked pull request is retargeted
    types: [opened, synchronize, reopened, edited]
jobs:
  stack:
    name: Based on the default branch
    runs-on: ubuntu-latest
    steps:
    - name: A stacked pull request waits for its base
      if: github.base_ref != github.event.repository.default_branch
      run: |
        echo "::error title=stacked::based on ${{ github.base_ref }}, not ${{ github.event.repository.default_branch }}: merge the pull request of ${{ github.base_ref }} first, then retarget this one to ${{ github.event.repository.default_branch }} and restack it"
        exit 1

