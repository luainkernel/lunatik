# Based on https://gist.github.com/domenic/ec8b0fc8ab45f39403dd
name: Build Modules
on:
  pull_request:
  push:
    branches:
    - master
jobs:
  build:
    name: Build ${{ matrix.kernel-version }} ${{ matrix.defconfig }}
    strategy:
      matrix:
        kernel-version: [6.6, 6.18, 7.2]
        defconfig: [defconfig]
        # a 32-bit kernel: modpost fails a module that leaves a libgcc helper unresolved, or exports one vmlinux does
        include:
        - kernel-version: 6.6
          defconfig: i386_defconfig
      fail-fast: false
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: Install dependencies
      run: |
        sudo apt-get update -qq
        sudo apt-get install -yq build-essential bc bison flex libssl-dev dwarves libelf-dev libbpf-dev libncurses-dev clang llvm pkg-config libpcap-dev lua5.5 m4 lld
    - name: Setup kernel ${{ matrix.kernel-version }}
      run: |
        SERIES="${{ matrix.kernel-version }}"
        # kernel.org publishes only the latest point release of each
        # maintained series: resolve it from releases.json (empty for an EOL
        # series) and fetch its tarball from the CDN, checked against the
        # series' sha256sums.asc, which names a truncated download as one
        ESC=$(echo "$SERIES" | sed 's/\./\\./g')
        curl -fsSL --retry 3 --retry-all-errors -o releases.json https://www.kernel.org/releases.json
        VERSION=$(grep -oE '"'"$ESC"'\.[0-9]+"' releases.json | tr -d '"' | head -1)
        test -n "$VERSION" || { echo "no maintained release for kernel series $SERIES"; exit 1; }
        CDN="https://cdn.kernel.org/pub/linux/kernel/v${VERSION%%.*}.x"
        TARBALL="linux-${VERSION}.tar.xz"
        curl -fsSL --retry 3 --retry-all-errors -o sha256sums.asc "$CDN/sha256sums.asc"
        SUM=$(awk -v f="$TARBALL" '$2 == f' sha256sums.asc)
        test -n "$SUM" || { echo "no checksum for $TARBALL"; exit 1; }
        echo "Fetching $TARBALL"
        for try in 1 2 3; do
          curl -sSL --retry 3 -o "$TARBALL" "$CDN/$TARBALL" && echo "$SUM" | sha256sum -c --quiet - && break
          test "$try" -lt 3 || { echo "$TARBALL does not match its checksum"; exit 1; }
          sleep 60
        done
        tar xf "$TARBALL"
        cd "linux-${VERSION}"
        make mrproper
        make ${{ matrix.defconfig }}
        options=(
          CONFIG_STACK_VALIDATION=n
          CONFIG_WERROR=n
          CONFIG_BPF_SYSCALL=y
          # sched_ext depends on BPF_JIT and DEBUG_INFO_BTF; without them
          # syncconfig drops SCHED_CLASS_EXT and luascx builds its stub
          CONFIG_BPF_JIT=y
          CONFIG_DEBUG_INFO_REDUCED=n
          CONFIG_DEBUG_INFO_DWARF_TOOLCHAIN_DEFAULT=y
          CONFIG_DEBUG_INFO_BTF=y
          CONFIG_SCHED_CLASS_EXT=y
          # v7.2 and later: the rng API luacrypto calls is built only for a user, here DRBG, its default stdrng
          CONFIG_CRYPTO_DRBG=y
        )
        printf '%s\n' "${options[@]}" >> .config
        # modpost resolves our modules' symbols against the Module.symvers this full build writes
        make -j$(nproc) vmlinux modules
        # syncconfig drops an option whose dependency is unmet, and the build passes without it
        for option in "${options[@]}"; do
          symbol=${option%=*}
          held=$(grep -E "^(# )?${symbol}[= ]" .config || true)
          case $option in
          *=n) [[ $held =~ =[ym]$ ]] || continue ;;
          # a symbol no Kconfig of the series defines, as SCHED_CLASS_EXT before v6.12, is not required
          *) [[ $held != "$option" ]] && grep -rqE "^\s*(menu)?config\s+${symbol#CONFIG_}\s*$" --include='Kconfig*' . || continue ;;
          esac
          echo "$option requested, .config holds ${held:-no $symbol line}"; exit 1
        done
        echo "KERNEL_DIR=$(pwd)" >> $GITHUB_ENV
    - name: Build Lunatik
      # not the checkout and holding no Makefile, so a build file that takes the checkout from PWD fails here
      working-directory: ${{ runner.temp }}
      run: |
        make -C "$GITHUB_WORKSPACE" clean MODULES_BUILD_PATH="${{ env.KERNEL_DIR }}"
        # a table an earlier build left and no spec generates, which make must not install
        touch "$GITHUB_WORKSPACE/autogen/linux/stale.lua"
        # with no PWD at all, as sudo make runs it
        env -u PWD make -j$(nproc) -C "$GITHUB_WORKSPACE" MODULES_BUILD_PATH="${{ env.KERNEL_DIR }}"
        # kbuild handed an empty M= builds its own tree and passes
        test -f "$GITHUB_WORKSPACE/lunatik.ko" || { echo "make built no lunatik.ko"; exit 1; }
    - name: Check lock contexts
      # sparse reads lock contexts through 6.19; doc/capi.md says why lunatik_lockkillable's callers stay
      if: matrix.kernel-version == '6.6' && matrix.defconfig == 'defconfig'
      run: |
        sudo apt-get install -yq sparse
        log="$RUNNER_TEMP/sparse.log"
        make C=2 MODULES_BUILD_PATH="${{ env.KERNEL_DIR }}" > "$log" 2>&1 || { tail -50 "$log"; exit 1; }
        grep -q 'CHECK .*lunatik_core\.c' "$log" || { echo "sparse checked no file"; exit 1; }
        left=$(grep 'context imbalance' "$log" | grep -vE "in '(lunatik_closekillable|lunatik_pcallobject|lunatik_resumeruntime|luathread_pushargs|luathread_claim)'" || true)
        test -z "$left" || { echo "$left"; exit 1; }
    - name: Verify install
      run: |
        dest="$RUNNER_TEMP/install"
        prefix=(INSTALL=install MODULES_INSTALL_PATH="$dest/kernel" SCRIPTS_INSTALL_PATH="$dest/lua" LUA_PATH="$dest/share" LUA_CPATH="$dest/lib" LUNATIK_INSTALL_PATH="$dest/bin")
        # what an earlier build and install leave: a module the tree dropped and a file in each directory it owns
        mkdir -p "$dest/kernel/lunatik"
        touch "$dest/kernel/lunatik/stale.ko" lib/stale.ko
        for d in lunatik socket netlink syscall crypto bpf skb linux; do mkdir -p "$dest/lua/$d"; touch "$dest/lua/$d/stale.lua"; done
        # what other installs put in each prefix, which make keeps: a file beside the tree's and a directory it does not own
        kept=("$dest/lua/kept.lua" "$dest/lua/kept/kept.lua" "$dest/kernel/kept/kept.ko" "$dest/share/kept.lua" "$dest/lib/kept.so" "$dest/bin/kept")
        mkdir -p "${kept[@]%/*}"; touch "${kept[@]}"
        make modules_install scripts_install "${prefix[@]}"
        # the modules the CLI loads, which autogen lists from the Makefile's configuration
        modules=$(lua5.5 -e 'print(table.concat(dofile("autogen/lunatik/config.lua").modules, " "))')
        for m in $modules; do
          nm "$dest/kernel/lunatik/$m.ko" | grep -q ' [Tt] ' || { echo "couldn't find code in $m.ko"; exit 1; }
        done
        left=$(find "$dest" -name 'stale.*')
        test -z "$left" || { echo "make install left $left"; exit 1; }
        # an install from a tree autogen has not run stops before it clears the CLI's library
        rm autogen/linux/*.lua autogen/lunatik/*.lua
        if make scripts_install "${prefix[@]}"; then echo "make install did not stop without autogen's output"; exit 1; fi
        test -f "$dest/lua/lunatik/config.lua" || { echo "make install cleared lunatik/ before it stopped"; exit 1; }
        # the skb directory an earlier install left, which make uninstall removes too
        mkdir -p "$dest/lua/skb"
        make scripts_uninstall "${prefix[@]}"
        test ! -e "$dest/lua/skb" || { echo "make uninstall left skb/"; exit 1; }
        for f in "${kept[@]}"; do test -f "$f" || { echo "make install or uninstall removed $f"; exit 1; }; done
        echo "Lunatik built successfully for kernel ${{ matrix.kernel-version }}"
    - name: Check autogen on a big-endian tree
      # the branch of cpu_big_endian and of efficient_unaligned_access that the x86 kernel above never takes
      run: |
        src="${{ env.KERNEL_DIR }}" be="$RUNNER_TEMP/be"
        make clean MODULES_BUILD_PATH="$src"
        # kbuild refuses an out-of-tree build from a source tree configured in place, as the one above is
        make -C "$src" mrproper
        export ARCH=mips LLVM=1
        make -C "$src" O="$be" malta_defconfig
        "$src/scripts/config" --file "$be/.config" -e CPU_BIG_ENDIAN -d CPU_LITTLE_ENDIAN
        make -C "$src" O="$be" olddefconfig
        make -j$(nproc) -C "$src" O="$be" modules_prepare
        make autogen MODULES_BUILD_PATH="$be"
        lua5.5 -e 'local c = dofile("autogen/lunatik/config.lua") assert(c.cpu_big_endian == true and c.efficient_unaligned_access == false, ("the big-endian MIPS tree read as cpu_big_endian = %s, efficient_unaligned_access = %s"):format(c.cpu_big_endian, c.efficient_unaligned_access))'

